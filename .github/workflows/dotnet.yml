# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: OmronFinsNetStandard
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish
      run: dotnet publish --no-restore -c Release
    - name: Pack
      run: dotnet pack --output nupkgs
    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: volkovskey
    - name: upload nuget package
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

